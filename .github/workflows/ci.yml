name: CI

# ENV-6 — until this file existed, every test in the repository protected only a
# developer who remembered to run it. 763 executable tests, 188 live
# authorization assertions, 32 live workout assertions and every static guard
# were manual. The live security suite — written to fail against the
# pre-remediation database, and the best test asset in the tree — had never run
# in CI and did not run in any discovery workstream.
#
# PRODUCTION IS NEVER CONTACTED BY THIS WORKFLOW. The only job that touches a
# real project is `live-qa`, which is pinned to the QA project, gated behind
# repository secrets, and skipped entirely when they are absent. The
# production-ref guard in `static-guards` is what keeps that true.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'
  NODE_VERSION: '20'

jobs:
  # ── Fast, no toolchain. Runs first so an environment-targeting mistake is
  #    reported in seconds rather than after a ten-minute build.
  static-guards:
    name: Static guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Production-ref guard (ENV-5)
        run: .github/scripts/check-production-refs.sh

      - name: Migration hygiene (ENV-1 / Gate 0.7)
        run: .github/scripts/check-migration-hygiene.sh

      - name: Migration durability — I-MIG-03 class guard (records mode)
        run: |
          set -euo pipefail
          # W2-2B. `CREATE OR REPLACE FUNCTION` keeps a function's ACL and owner
          # and drops its `search_path` pin and its body — so an authorization
          # wrapper an earlier migration established vanishes silently when a
          # later migration reproduces that function from an older base. That is
          # F-J-01, and it is why this class guard exists. Static: it reads
          # committed migration source, needs no credentials, and contacts
          # nothing. Node comes preinstalled on the runner image, so this step
          # keeps the job's no-toolchain property.
          echo "node $(node --version)"
          echo

          # The self-test first, and always fatal. If detection itself broke, a
          # clean report would be indistinguishable from a clean tree — this
          # asserts on synthetic fixtures that a dropped property IS flagged,
          # that a carried-forward one is NOT, and that F-J-01 is still found in
          # the real migration set with its exemption ignored.
          node supabase/tests/security/migration-durability-guard.mjs --self-test
          echo

          # RECORDS MODE, and fail-closed everywhere it is not exempt: the guard
          # exits 0 only while every open strip event is a KNOWN_OPEN entry that
          # names its finding and its closing task. An unrecorded strip fails,
          # and so does a KNOWN_OPEN entry that has outlived its defect — the
          # stale-exemption trap, which is what stops records mode from decaying
          # into a rubber stamp once 2A lands.
          set +e
          node supabase/tests/security/migration-durability-guard.mjs | tee /tmp/imig03.txt
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "::error title=I-MIG-03 durability violation::A migration dropped a security property that is not a recorded finding, or a KNOWN_OPEN exemption outlived its defect. Carry the property forward in a NEW migration - never by editing history. Full report in this step's log."
            exit 1
          fi

          # Surface the known-open posture in the run summary, derived from the
          # guard's own register rather than restated here, so this annotation
          # cannot drift from what the guard actually found.
          recorded=$(grep -c '\[RECORDED' /tmp/imig03.txt || true)
          if [ "${recorded:-0}" -gt 0 ]; then
            findings=$(grep -E '^[[:space:]]+finding:' /tmp/imig03.txt | sed 's/^[[:space:]]*finding:[[:space:]]*//' | paste -sd '; ' -)
            echo "::notice title=I-MIG-03 records the posture::${recorded} known-open durability finding(s) DETECTED and deliberately not failing this build: ${findings}. Detected, not fixed - remediation is migration 124 (Wave 2 task 2A), and this guard is promoted to enforcing at that closure. This step passing does NOT close SEC-04 or I-MIG-03."
          fi

      - name: Migration state declaration — ENV-3 static contract
        run: |
          set -euo pipefail
          # ENV-3, static half. Reconciles supabase/expected_applied.json against
          # the authored migration tree: every authored migration is declared
          # (applied below the frontier, or deliberately pending/excluded with a
          # reason and a gate), and every declaration names a migration that
          # exists. It opens no connection and needs no credential.
          #
          # It does NOT check the live ledger. The live half — comparing the
          # declaration against supabase_migrations.schema_migrations — needs a
          # QA database credential in CI (the FG-1/FG-2 blocker) and is what
          # finally moves ENV-3 to VERIFIED_CLOSED. ENV-3 stays REMEDIATED.
          #
          # A committed-but-unapplied migration (123 today) is REPORTED here as
          # pending and is not a failure. It is never written into
          # schema_migrations to make a check green.
          node supabase/scripts/check-migration-manifest.mjs

      - name: Edge Function JWT posture is declared (E-09)
        run: .github/scripts/check-edge-function-config.sh

      - name: No environment file names production as a default (ENV-4)
        run: |
          set -euo pipefail
          # app_env.dart must carry no project at all. dart_defines/prod.json is
          # the only place production configuration is allowed to live, and it
          # only reaches a binary that was explicitly pointed at it.
          #
          # W1B-N7: the patterns match REAL credential material only. A real
          # Supabase project host is 20 lowercase alphanumerics before
          # .supabase.co; a real JWT is eyJ + 20+ token chars; a real Stripe
          # publishable key is pk_(test|live)_ + 24+ alphanumerics. The file's
          # documentation placeholders (YOUR_QA_REF.supabase.co, pk_test_...)
          # match none of them — which is the point: comments are NOT excluded
          # from the scan, so a real key pasted anywhere in the file, comments
          # included, still fails. Residual coverage below these thresholds
          # comes from the production-ref guard (any occurrence of the
          # production ref, any file) and the QA-artifact allowlist scan (any
          # project ref in the built bundle).
          REAL='([a-z0-9]{20}\.supabase\.co|eyJ[A-Za-z0-9_-]{20,}|pk_(test|live)_[A-Za-z0-9]{24,})'

          # Pattern self-test — the standing regression guard for W1B-N7.
          # Real-shaped material must match; the placeholder shapes that caused
          # the aac64b3 false positive must not. If either half breaks, the
          # guard itself is wrong, and it says so before judging the file.
          selftest_real='aaaaaaaaaaaaaaaaaaaa.supabase.co
          eyJabcdefghijklmnopqrstuvwx
          pk_test_abcdefghijklmnopqrstuvwxyz'
          selftest_placeholder='https://YOUR_QA_REF.supabase.co
          SUPABASE_ANON_KEY=YOUR_QA_PUBLISHABLE_KEY
          pk_test_...'
          while IFS= read -r s; do
            [[ -z "${s// /}" ]] && continue
            if ! grep -qE "$REAL" <<<"$s"; then
              echo "GUARD SELF-TEST FAIL — real-shaped material not matched: $s"
              exit 1
            fi
          done <<<"$selftest_real"
          while IFS= read -r s; do
            [[ -z "${s// /}" ]] && continue
            if grep -qE "$REAL" <<<"$s"; then
              echo "GUARD SELF-TEST FAIL — placeholder matched as real: $s"
              exit 1
            fi
          done <<<"$selftest_placeholder"

          if grep -qE "$REAL" apps/mobile/lib/core/config/app_env.dart; then
            echo "FAIL — a project URL, JWT or Stripe key is baked into app_env.dart:"
            grep -nE "$REAL" apps/mobile/lib/core/config/app_env.dart
            echo "ENV-4: an omitted APP_ENV must resolve to an environment that"
            echo "can reach nothing, which requires the default table to be empty."
            exit 1
          fi
          echo "OK — app_env.dart carries no baked-in project (doc placeholders allowed; real material anywhere, comments included, is not)."

  flutter:
    name: Flutter — analyze, test, QA web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: flutter analyze
        # Errors fail the build; the tree's 171 pre-existing infos/warnings do
        # not, so this gate is meaningful on day one rather than after a cleanup
        # that has not been scheduled.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: flutter test
        # Includes the ENV-4 / ENV-5 environment ratchets, the REL-3 release
        # route gate, the error-contract guards and the Phase 1/2 boundary tests.
        run: flutter test

      - name: Build the QA web bundle
        # QA, explicitly. A bundle built with no defines would now fail to
        # resolve an environment at all, which is the ENV-4 behaviour under test
        # above; here we want a real artifact to scan.
        run: flutter build web --dart-define-from-file=dart_defines/qa.json

      - name: Scan the artifact for credential material
        run: tool/check_web_build_secrets.sh build/web

      - name: The QA artifact must name no project other than QA
        run: |
          set -euo pipefail
          # Allowlist, not blocklist: extract every Supabase project ref the
          # bundle contains and fail on any that is not the QA ref the bundle
          # was built from. This catches production AND any other foreign
          # project, and it keeps the production literal out of this file
          # (ENV-5 guard). Fail closed if the QA ref cannot be derived.
          QA_REF="$(grep -oE 'https://[a-z]{20}\.supabase\.co' dart_defines/qa.json \
                    | head -1 | sed -E 's#https://([a-z]{20})\.supabase\.co#\1#')"
          if [[ -z "$QA_REF" ]]; then
            echo "FAIL — could not derive the QA project ref from dart_defines/qa.json."
            exit 1
          fi
          foreign="$(grep -rhoaE '[a-z]{20}\.supabase\.co' build/web | sort -u \
                     | grep -v "^${QA_REF}\.supabase\.co$" || true)"
          if [[ -n "$foreign" ]]; then
            echo "FAIL — the QA web build names a project other than QA:"
            echo "$foreign"
            exit 1
          fi
          echo "OK — the QA artifact names only the QA project (${QA_REF})."

  api:
    name: API — unit + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:api

  # ── The live suites. EB-1 provisions the scoped QA service-role key that this
  #    job needs; until then it SKIPS rather than fails, so ENV-6's always-on
  #    half lands now instead of waiting on a credential.
  #
  #    It is pinned to the QA project two ways: the URL comes from a secret, and
  #    supabase/tests/{security,ai}/lib.mjs refuse to run against production
  #    regardless of what the secret contains.
  live-qa:
    name: Live QA suites (security / AI / contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [static-guards]
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - name: Are the QA credentials provisioned?
        id: creds
        env:
          QA_URL: ${{ secrets.QA_URL }}
          QA_ANON: ${{ secrets.QA_ANON }}
          QA_SERVICE: ${{ secrets.QA_SERVICE }}
        run: |
          if [[ -n "$QA_URL" && -n "$QA_ANON" && -n "$QA_SERVICE" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Live QA suites skipped::EB-1 has not provisioned QA_URL / QA_ANON / QA_SERVICE. 188 live authorization assertions are NOT running."
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.present == 'true'

      - name: Confirm the target is QA and not production
        if: steps.creds.outputs.present == 'true'
        env:
          QA_URL: ${{ secrets.QA_URL }}
        run: |
          set -euo pipefail
          # Positive identification, before anything connects. A target is QA
          # because its ref says so, never because the secret is called QA_URL.
          # Allowlist only: an exact-host match on the QA project. Production —
          # and every other project — fails this check identically, so the
          # production literal has no business in this file (ENV-5 guard).
          if [[ "$QA_URL" != "https://eyqtldjqpgpljlqvpowh.supabase.co" ]]; then
            echo "FAIL — QA_URL is not exactly the 12 Circle QA project URL."
            exit 1
          fi
          echo "OK — target is the 12 Circle QA project."

      - name: Fixture identities (setup-identities.mjs → ids.json)
        # W1B-N8. The suites read their four fixture UUIDs from
        # supabase/tests/security/ids.json, which is generated, ignored and
        # deliberately never committed — so an ephemeral CI checkout can never
        # contain it, and without this step all six suites die at import with
        # "ids.json missing". The script is idempotent: it creates the four
        # p1-*@qa.12circle.test identities only if absent (repairs them
        # otherwise), flags them is_demo, and seeds the victim's three
        # P1-FIXTURE rows only if absent. This is the programme's one sanctioned
        # standing QA write, authorized by the product owner 2026-08-25; it runs
        # strictly after the exact-host QA confirmation above, and lib.mjs
        # independently refuses a production URL. ids.json lives and dies with
        # this runner's workspace.
        if: steps.creds.outputs.present == 'true'
        env:
          QA_URL: ${{ secrets.QA_URL }}
          QA_ANON: ${{ secrets.QA_ANON }}
          QA_SERVICE: ${{ secrets.QA_SERVICE }}
        run: node supabase/tests/security/setup-identities.mjs

      - name: Live security suite
        if: steps.creds.outputs.present == 'true'
        env:
          QA_URL: ${{ secrets.QA_URL }}
          QA_ANON: ${{ secrets.QA_ANON }}
          QA_SERVICE: ${{ secrets.QA_SERVICE }}
        run: npm run test:security

      - name: Live AI suite
        if: steps.creds.outputs.present == 'true'
        env:
          QA_URL: ${{ secrets.QA_URL }}
          QA_ANON: ${{ secrets.QA_ANON }}
          QA_SERVICE: ${{ secrets.QA_SERVICE }}
        run: npm run test:ai

      - name: Contract suite
        if: steps.creds.outputs.present == 'true'
        env:
          QA_URL: ${{ secrets.QA_URL }}
          QA_ANON: ${{ secrets.QA_ANON }}
          QA_SERVICE: ${{ secrets.QA_SERVICE }}
        run: npm run test:contract
      # ── Live SQL evidence: FG-1, FG-2 and the ENV-3 live ledger check.
      #
      #    One phase, one credential. These three are SQL-level assertions that
      #    the REST secrets above cannot reach: supabase_migrations is not an
      #    exposed PostgREST schema, and neither SQL suite is reachable over
      #    REST at all. QA_DB_URL is therefore scoped to this single step and
      #    to no other job.
      #
      #    Read-only by construction: every suite is one DO block that ends by
      #    RAISEing its report, so the transaction always rolls back, and the
      #    runner refuses to execute a suite that lost its RAISE. It applies no
      #    migration, runs no db push or repair, and writes nothing to
      #    schema_migrations.
      #
      #    The runner proves its target is QA by allowlist before connecting and
      #    SKIPS cleanly when QA_DB_URL is absent, so this step is safe to land
      #    before the secret exists (blocker EB-13).
      - name: Live SQL evidence — FG-1, FG-2, ENV-3 ledger
        if: steps.creds.outputs.present == 'true'
        env:
          QA_DB_URL: ${{ secrets.QA_DB_URL }}
        run: supabase/scripts/live-evidence.sh
